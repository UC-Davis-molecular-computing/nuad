# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-latest
  tools:
    # Matches the Python version used by the "Docs Check" GitHub Actions workflow.
    # Sphinx 9 requires >= 3.12, so an older Python here would silently resolve an
    # older Sphinx than CI builds with.
    python: "3.12"

# Build documentation in the doc/ directory with Sphinx
sphinx:
  configuration: doc/conf.py

# If using Sphinx, optionally build your docs in additional formats such as PDF
# formats:
#    - pdf

# Install nuad itself plus the [doc] extra, so the dependency list lives only in
# pyproject.toml. Sphinx autodoc *imports* the nuad modules to read their docstrings
# and signatures, so nuad's own runtime dependencies have to be installed too --
# except nupack, which doc/conf.py mocks via autodoc_mock_imports.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc
