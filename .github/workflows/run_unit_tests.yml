# This workflow will install Python dependencies and run the test suite
# with a variety of Python versions.
# For more information see:
# https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Run Unit Tests

on: pull_request

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install nuad and test dependencies
        # The [nupack] extra is deliberately not installed: NUPACK is not on PyPI, so it
        # cannot be resolved here. nuad imports it lazily, so the suite runs without it
        # and the single NUPACK-only test skips itself.
        run: python -m pip install -e '.[test]'
      - name: Test with pytest
        run: python -m pytest tests/test.py -v
