# This workflow will install Python dependencies and run the test suite
# with a variety of Python versions.
# For more information see:
# https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Run Unit Tests

on: pull_request

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install dependencies
        run: |
          # NUPACK is not on PyPI; it ships as a licensed wheel. This workflow used to
          # get it from the unhumbleben/nupack:latest image, but that image was built in
          # 2022 and only contains wheels for CPython 3.6-3.9 -- none for the versions
          # tested here. nuad imports nupack lazily, so the suite runs without it and the
          # single NUPACK-only test skips itself.
          grep -vx 'nupack' requirements.txt > "${RUNNER_TEMP}/requirements-ci.txt"
          python -m pip install -r "${RUNNER_TEMP}/requirements-ci.txt"
      - name: Test with pytest
        run: |
          python -m pytest tests/test.py -v
