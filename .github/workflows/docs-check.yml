name: "Docs Check"

on: pull_request

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install nuad and doc dependencies
        # sphinx autodoc imports the nuad modules, so nuad's own dependencies are
        # needed too. The [nupack] extra is not installed: NUPACK is not on PyPI, and
        # nuad imports it lazily, so the modules import fine without it.
        run: python -m pip install -e '.[doc]'
      - name: Build docs
        run: |
          cd doc
          sphinx-build -T -E -W -b html . _build
